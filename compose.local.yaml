services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuadrant-backend-local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=5&conn_max_age=60
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      AUTHENTIK_ISSUER_URL: http://localhost:9000/application/o/cuadrant/
      AUTHENTIK_INTERNAL_URL: http://host.docker.internal:9000
      AUTHENTIK_SCOPES: openid profile email offline_access
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: cuadrant-frontend-local
    build:
      args:
        FRONTEND_PUBLIC_API_BASE_URL: /api
        FRONTEND_PUBLIC_AUTH_ISSUER_URL: http://localhost:9000/application/o/cuadrant/
        FRONTEND_PUBLIC_AUTH_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
        FRONTEND_PUBLIC_AUTH_REDIRECT_URI: http://localhost:4200/auth/callback
        FRONTEND_PUBLIC_AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:4200/login
        FRONTEND_PUBLIC_AUTH_SCOPES: openid profile email offline_access
    ports:
      - "4200:8080"

  db:
    image: postgres:17-alpine
    container_name: cuadrant-db-local
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cuadrant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - planning_net

volumes:
  cuadrant_postgres_data:
