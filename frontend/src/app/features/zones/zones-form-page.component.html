<hlm-dialog-header>
  <h2 hlmDialogTitle>{{ isEditMode ? 'Edit work area' : 'New work area' }}</h2>
  <p hlmDialogDescription>
    {{
      isEditMode
        ? 'Update an existing work area used in planning assignments.'
        : 'Create a work area where employees can be assigned.'
    }}
  </p>
</hlm-dialog-header>

@if (isEditMode && workAreaResource.isLoading()) {
  <div class="py-6 text-sm">Loading work area details...</div>
} @else {
  <app-zones-form
    [initialValue]="initialValue()"
    [submitLabel]="isEditMode ? 'Save changes' : 'Create work area'"
    [formError]="formError()"
    [submitForm]="saveWorkArea.bind(this)"
    (cancelled)="dialogRef.close()"
  />
}
