<section class="flex min-w-0 flex-1 flex-col gap-6">
  <div class="space-y-1">
    <p class="text-muted-foreground text-sm font-medium uppercase tracking-[0.2em]">Management</p>
    <div>
      <h1 class="text-3xl font-semibold tracking-tight">{{ isEditMode ? 'Edit employee' : 'New employee' }}</h1>
      <p class="text-muted-foreground text-sm">
        {{ isEditMode ? 'Update a team member and their planning permissions.' : 'Create a new team member and assign their planning rules.' }}
      </p>
    </div>
  </div>

  @if (employeeFormResource.isLoading()) {
    <div class="bg-card rounded-lg border p-6 text-sm">Loading employee form...</div>
  } @else {
    <app-employees-form
      [initialValue]="initialValue()"
      [positions]="positions()"
      [zones]="zones()"
      [submitLabel]="isEditMode ? 'Save changes' : 'Create employee'"
      [formError]="formError()"
      [submitForm]="saveEmployee.bind(this)"
      cancelLink="/employees"
    />
  }
</section>
