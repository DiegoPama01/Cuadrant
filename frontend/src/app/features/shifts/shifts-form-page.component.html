<hlm-dialog-header class="mb-6">
  <h2 hlmDialogTitle>{{ isEditMode ? 'Edit shift template' : 'New shift template' }}</h2>
  <p hlmDialogDescription>
    {{
      isEditMode
        ? 'Update an existing shift definition used in planning.'
        : 'Create a shift definition for workforce scheduling.'
    }}
  </p>
</hlm-dialog-header>

@if (isEditMode && shiftResource.isLoading()) {
  <div class="py-6 text-sm">Loading shift template details...</div>
} @else {
  <app-shifts-form
    [initialValue]="initialValue()"
    [submitLabel]="isEditMode ? 'Save changes' : 'Create shift template'"
    [formError]="formError()"
    [submitForm]="saveShiftTemplate.bind(this)"
    (cancelled)="dialogRef.close()"
  />
}
