<hlm-dialog-header class="mb-6">
  <h2 hlmDialogTitle>{{ isEditMode ? 'Edit job role' : 'New job role' }}</h2>
  <p hlmDialogDescription>
    {{
      isEditMode
        ? 'Update an existing role used in planning assignments.'
        : 'Create a role your team can be assigned to during planning.'
    }}
  </p>
</hlm-dialog-header>

@if (isEditMode && positionResource.isLoading()) {
  <div class="py-6 text-sm">Loading job role details...</div>
} @else {
  <app-positions-form
    [initialValue]="initialValue()"
    [submitLabel]="isEditMode ? 'Save changes' : 'Create job role'"
    [formError]="formError()"
    [submitForm]="saveJobRole.bind(this)"
    (cancelled)="dialogRef.close()"
  />
}
