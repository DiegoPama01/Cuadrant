<section class="flex min-w-0 flex-1 flex-col gap-6">
  <div class="space-y-1">
    <p class="text-muted-foreground text-sm font-medium uppercase tracking-[0.2em]">Settings</p>
    <div>
      <h1 class="text-3xl font-semibold tracking-tight">
        {{ isEditMode ? 'Edit position' : 'New position' }}
      </h1>
      <p class="text-muted-foreground text-sm">
        {{ isEditMode ? 'Update an existing role used in planning assignments.' : 'Create a role your team can be assigned to during planning.' }}
      </p>
    </div>
  </div>

  @if (isEditMode && positionResource.isLoading()) {
    <div class="bg-card rounded-lg border p-6 text-sm">Loading position details...</div>
  } @else {
    <app-positions-form
      [initialValue]="initialValue()"
      [submitLabel]="isEditMode ? 'Save changes' : 'Create position'"
      [formError]="formError()"
      [submitForm]="savePosition.bind(this)"
      cancelLink="/settings/positions"
    />
  }
</section>
