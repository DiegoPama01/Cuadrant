<div hlmSidebarWrapper class="flex min-h-svh flex-col pt-(--header-height)">
  <ng-content select="[header]" />
  <div class="flex flex-1">
    <hlm-sidebar
      sidebarContainerClass="top-(--header-height) h-[calc(100svh-var(--header-height))]"
    >
      <hlm-sidebar-header>
        <ul hlmSidebarMenu>
          <li hlmSidebarMenuItem class="flex items-center gap-2">
            <button
              hlmSidebarMenuButton
              size="lg"
              type="button"
              class="min-w-0 flex-1"
              [hlmDropdownMenuTrigger]="installationMenu"
            >
              <div
                class="bg-sidebar-primary text-sidebar-primary-foreground flex aspect-square size-8 items-center justify-center rounded-lg"
              >
                <ng-icon name="lucideCommand" class="text-base" />
              </div>
              <div class="grid flex-1 text-left text-sm leading-tight">
                <span class="truncate font-medium">{{ companyName() }}</span>
                <span class="truncate text-xs">{{ activeInstallationName() }}</span>
              </div>
              <ng-icon name="lucideChevronsUpDown" class="ml-auto text-base" />
            </button>
          </li>
        </ul>
      </hlm-sidebar-header>

      <hlm-sidebar-content>
        <spartan-nav-main [items]="data.navMain" />
      </hlm-sidebar-content>
      <hlm-sidebar-footer>
        <spartan-nav-user
          [user]="user()"
          [canManageCompany]="canManageCompany()"
          (logoutRequested)="requestLogout()"
        />
      </hlm-sidebar-footer>
    </hlm-sidebar>
    <ng-content />
  </div>
</div>

<ng-template #installationMenu>
  <hlm-dropdown-menu class="min-w-64 rounded-lg">
    <hlm-dropdown-menu-label>Switch installation</hlm-dropdown-menu-label>
    <hlm-dropdown-menu-separator />
    @for (installation of installations(); track installation.id) {
      <button hlmDropdownMenuItem type="button" (click)="selectInstallation(installation.id)">
        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium">{{ installation.name }}</span>
          @if (installation.code) {
            <span class="text-muted-foreground truncate text-xs">{{ installation.code }}</span>
          }
        </div>
        @if (installation.id === activeInstallationId()) {
          <ng-icon name="lucideCheck" class="ml-2 text-base" />
        }
      </button>
    }
  </hlm-dropdown-menu>
</ng-template>
