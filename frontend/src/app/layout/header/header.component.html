<header class="bg-background fixed inset-x-0 top-0 z-50 flex w-full items-center border-b">

    <button hlmSidebarTrigger></button>
    <hlm-separator orientation="vertical" class="mr-2" />

    <div hlmInputGroup class="ml-auto hidden w-full sm:w-auto md:flex">
      <input hlmInputGroupInput placeholder="Type to search..." />

        <ng-icon name="lucideSearch" />
      </div>
    </div>
  </div>
</header>
