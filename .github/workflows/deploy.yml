name: Deploy production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/planning-app
            git pull origin master
            docker compose -f compose.yaml -f compose.prod.yaml up -d --build backend frontend
            docker compose -f compose.yaml -f compose.prod.yaml exec -T backend python manage.py migrate 
